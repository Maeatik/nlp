<!-- calculator.html -->
<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Задачи NLP</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h2>Задачи NLP</h2>
    <div class="form-container">
        <form method="post" id="calculator-form">
            {% csrf_token %}
            <div class="form-header">
                <div class="task-select">
                    <label for="id_operation">Выберите задачу:</label>
                    {{ form.operation }}
                    <label for="id_librarychoice">Выберите библиотеку:</label>
                    {{ form.librarychoice }}
                    <button type="submit">Решить задачу</button>
                </div>
            </div>
            <div class="form-body">
                <div class="input-area">
                    <label for="id_input_text">Исходный текст:</label>
                    {{ form.input_text }}
                </div>
                <div class="output-area">
                    <label for="id_output_text">Результат:</label>
                    {{ form.output_text }}
                </div>
            </div>         
        </form>
    </div>
</body>
</html>
